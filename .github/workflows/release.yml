name: Release

# Push a tag (git tag v2.1.0 && git push origin v2.1.0) to publish the
# single-file build: system-update and system-update.sha256 are attached to
# a GitHub release, where `system-update --self-update` of a single-file
# install looks for them (releases/latest/download/...).
#
# A release made first in the web UI (which also creates the tag) is fine:
# the files are uploaded to it instead of creating a second one. A release
# that is missing its files (the tag ran before this was handled) gets them
# from Actions > Release > Run workflow with that tag, e.g. v2.1.0.
#
# Only the publish job can write to the repository. The tests (which run
# third-party code: bats-core, pinned to a release commit) run in a
# read-only job without any token, and the published file is built from a
# clean checkout in the publish job itself.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach the files to (e.g. v2.1.0)'
        required: true

permissions:
  contents: read

env:
  # The tag being released: the pushed tag, or the one given to Run workflow.
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  BATS_REPO: https://github.com/bats-core/bats-core.git
  BATS_COMMIT: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5   # v1.14.0

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the tag name
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - run: tests/lint.sh
      - name: Fetch bats-core (pinned)
        run: |
          git init -q tests/vendor/bats-core
          git -C tests/vendor/bats-core fetch -q --depth 1 "$BATS_REPO" "$BATS_COMMIT"
          git -C tests/vendor/bats-core checkout -q FETCH_HEAD
      - run: tests/run.sh
      - name: Check the tag matches VERSION
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          [ "v$v" = "$TAG" ] || { echo "tag $TAG does not match VERSION ($v)"; exit 1; }

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check the tag name
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Build
        run: |
          ./build.sh dist/system-update
          (cd dist && sha256sum system-update > system-update.sha256)
          dist/system-update --version
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A release created by hand for this tag keeps its title and notes
        # and gets the files (replacing older uploads of them); otherwise
        # the release is created here.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/system-update dist/system-update.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/system-update dist/system-update.sha256 --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
